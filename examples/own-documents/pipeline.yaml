# Minor example 2: your own documents only. No paper search and no screening.
# Walkthrough: examples/README.md. Paths are relative to this file.
#   uv run chitchat run -c examples/own-documents/pipeline.yaml --stages ingest,sanitize,export,index

run_name: own-documents-example
runs_dir: ../../runs

discovery:
  config: ../../configs/discovery/discovery.yaml   # required by the config, not used here

own_documents:
  folder: ../my_docs/                  # the 7 fictional sample documents
  fast: true

privacy:
  sanitize_config: ../../configs/sanitize.yaml
  before_screening: true
  rag_privacy_config: ../../configs/rag_privacy.yaml

screening:
  criteria: ../../configs/criteria.example.yaml
  llm: { llm_name: gpt-4o-mini, temperature: 0 }

index:
  db_uri: auto                         # Windows: Milvus in Docker (127.0.0.1:19530). macOS/Linux: a milvus.db file in the run folder
  db_name: review
  collection: own_documents_example
  include_own_documents: true

ask:
  llm: { llm_name: gpt-4o-mini, temperature: 0 }
  k: 6
  reranker: null
