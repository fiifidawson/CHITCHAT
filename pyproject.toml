[project]
name = "chitchat"
version = "0.1.0"
description = "Literature-review pipeline: discover, sanitize, screen, export, index and ask, built on mmore."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    # Owner's fork with the Paper Discovery fixes not yet merged upstream (EPFLiGHT/mmore#367).
    "mmore[paper_discovery,rag,api,privacy,tui,cpu] @ git+https://github.com/fiifidawson/mmore.git@086c005",
    "pydantic>=2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13",
    "typer>=0.12",
]

[project.scripts]
chitchat = "chitchat.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chitchat"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
# milvus-lite has no Windows build. On Windows, run Milvus in Docker (see README).
override-dependencies = ["milvus-lite; sys_platform != 'win32'"]
# mmore needs numpy<2 on Python < 3.12. pyarrow 22+ needs numpy 2 but doesn't declare it.
constraint-dependencies = ["pyarrow<22"]

# uv ignores a dependency's own [tool.uv.sources], so torch is routed here.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: needs network, models or API keys"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
