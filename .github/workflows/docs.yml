name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 is required only if git-revision-date-localized is
          # enabled in mkdocs.yml. Harmless (just slower) otherwise.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked fails the build if uv.lock has drifted from pyproject.toml,
      # so CI can never silently install a different set than a contributor.
      - name: Install documentation dependencies
        run: uv sync --locked

      # --strict turns broken internal links and unrecognised nav entries into
      # build failures. That is the regression test for page moves.
      - name: Build (warnings are errors)
        env:
          CI: true
          # Advocacy banners printed at import time by mkdocs-material and
          # mkdocs-redirects. Cosmetic only; they do not affect the output.
          NO_MKDOCS_2_WARNING: 'true'
          DISABLE_MKDOCS_2_WARNING: 'true'
        run: uv run mkdocs build --strict

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
