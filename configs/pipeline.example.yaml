# Copy this file to the repo root as pipeline.yaml, then edit it.
#   cp configs/pipeline.example.yaml pipeline.yaml
# Paths are relative to the folder this file is in.

run_name: humanitarian-llm-2026       # outputs go to runs/<run_name>/
runs_dir: runs

discovery:
  config: configs/discovery/discovery.yaml   # mmore PaperDiscoveryConfig

own_documents:
  folder: my_docs/                    # optional; ingest is skipped if it doesn't exist
  fast: true                          # no OCR models

privacy:
  sanitize_config: configs/sanitize.yaml
  before_screening: true              # sanitize paper text before the screening LLM sees it
  rag_privacy_config: configs/rag_privacy.yaml   # null = no privacy mode when answering

# The one model every LLM step uses (search planning, screening, answer, ask, evaluation).
# Local and open by default. Other choices: configs/models/ and docs/MODELS.md.
llm:
  llm_name: qwen3.5:9b
  base_url: http://localhost:11434/v1   # Ollama
  temperature: 0

screening:
  criteria: configs/criteria.example.yaml
  min_year: 2020
  min_chars: 500                      # applies to the text actually sent
  max_chars: 24000                    # head + tail budget per paper; fits a 16k context
  use_abstract_if_no_text: true
  max_concurrency: 4

index:
  db_uri: auto                         # Windows: Milvus in Docker (127.0.0.1:19530). macOS/Linux: a milvus.db file in the run folder
  db_name: review
  collection: review
  dense_model: sentence-transformers/all-MiniLM-L6-v2
  sparse_model: splade
  include_labels: [HIGH, MEDIUM, LOW]
  include_own_documents: true

ask:
  k: 6
  reranker: BAAI/bge-reranker-base    # null to skip the download

# The final stage answers this with a decision brief (agents: Planner, Retriever, Writer, Critic).
# `chitchat search` answers your own question instead; this one is for `chitchat run`.
answer:
  question: "How should humanitarian organisations collect data for LLMs ethically, and what are the trade-offs between the main approaches?"
  max_rounds: 3
