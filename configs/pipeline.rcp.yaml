# A full deep search on one 80 GB GPU (EPFL RCP), with Qwen3.6 27B and its full 262k context.
# Step by step: docs/RCP.md. In short, start the model server in the same pod:
#   vllm serve Qwen/Qwen3.6-27B-FP8 --max-model-len 262144 --reasoning-parser qwen3 --max-num-seqs 64 --default-chat-template-kwargs '{"enable_thinking": false}'
# (--max-num-seqs 64: the default 1024 doesn't fit next to the full context; CHITCHAT sends at most 8.)
# (thinking off: with it on, Qwen often thought past 32k tokens on one paper and screening failed.)
# Then, in the terminal that runs CHITCHAT:
#   uv run chitchat search -c configs/pipeline.rcp.yaml --plan-only "your question"
#   nohup uv run chitchat run -c runs/<folder>/pipeline.yaml > run.log 2>&1 &
# The same `chitchat run` line carries on after any stop.
# Paths are relative to this file's folder (configs/).

run_name: rcp
runs_dir: ../runs

discovery:
  config: discovery/discovery.yaml    # only for --predefined

own_documents:
  folder: ../my_docs/
  fast: true

privacy:
  mask: false                         # true: mask personal data before the model sees any text
  sanitize_config: sanitize.yaml
  rag_privacy_config: rag_privacy.yaml

llm:
  llm_name: Qwen/Qwen3.6-27B-FP8        # must match the name given to `vllm serve`
  base_url: http://localhost:8000/v1    # vLLM in this pod
  temperature: 0.6                      # Qwen's recommended sampling; 0 can make it repeat itself
  max_new_tokens: 32768                 # the longest reply; a runaway fails in minutes, not hours

search:
  mode: deep                            # 3 to 6 categories, 25 results per source, 2 pages

screening:
  criteria: criteria.example.yaml       # only for --predefined: `search` drafts criteria for your question
  min_year: 2020
  min_chars: 500
  max_chars: 200000                   # about 50k tokens: most papers are sent whole
  use_abstract_if_no_text: true
  max_concurrency: 8                  # vLLM serves requests in parallel

index:
  db_uri: auto                        # Linux: a milvus.db file in the run folder
  db_name: review
  collection: rcp

ask:
  k: 10
  reranker: null

# The final stage answers your search question with a decision brief.
answer:
  max_rounds: 3
  k_per_query: 10
  max_evidence_chars: 150000          # about 40k tokens of passages for the Writer
