# A test run of about 20 papers (at most 24 before duplicates are removed).
#   uv run chitchat run -c configs/pipeline.smoke20.yaml
# Paths are relative to this file's folder (configs/).

run_name: smoke20
runs_dir: ../runs

discovery:
  config: discovery/discovery.smoke20.yaml

own_documents:
  folder: ../my_docs/
  fast: true

privacy:
  sanitize_config: sanitize.yaml
  before_screening: true
  rag_privacy_config: rag_privacy.yaml

# The one model every LLM step uses (search planning, screening, answer, ask, evaluation).
# Local and open by default. Other choices: configs/models/ and docs/MODELS.md.
llm:
  llm_name: qwen3.5:9b
  base_url: http://localhost:11434/v1   # Ollama
  temperature: 0

screening:
  criteria: criteria.example.yaml
  min_year: 2020
  min_chars: 500
  max_chars: 24000                    # fits a 16k context
  use_abstract_if_no_text: true
  max_concurrency: 4

index:
  db_uri: auto                         # Windows: Milvus in Docker (127.0.0.1:19530). macOS/Linux: a milvus.db file in the run folder
  db_name: review
  collection: smoke20

ask:
  k: 6
  reranker: null                         # skip the reranker download in tests

# The final stage answers this with a decision brief (agents: Planner, Retriever, Writer, Critic).
# `chitchat search` answers your own question instead; this one is for `chitchat run`.
answer:
  question: "How should humanitarian organisations collect data for LLMs ethically, and what are the trade-offs between the main approaches?"
  max_rounds: 3
